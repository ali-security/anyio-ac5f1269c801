name: test suite

on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: "Optional pytest selector/args"
        required: false
        default: ""
        type: string

jobs:
  changed-files:
    if: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      workflow-changed: ${{ steps.changed-files.outputs.workflow_any_changed }}
      pyproject-changed: ${{ steps.changed-files.outputs.src_any_changed }}
      src-changed: ${{ steps.changed-files.outputs.src_any_changed }}
      tests-changed: ${{ steps.changed-files.outputs.tests_any_changed }}
      docs-changed: ${{ steps.changed-files.outputs.doc_any_changed }}
    steps:
    - uses: actions/checkout@v4
    - name: Get changed files by category
      id: changed-files
      uses: tj-actions/changed-files@v41
      with:
        files_yaml: |
          workflow:
          - .github/workflows/test.yml
          pyproject:
          - pyproject.toml
          src:
          - src/**
          tests:
          - tests/**
          doc:
          - README.rst
          - docs/**

  pyright:
    runs-on: ubuntu-latest
    needs: changed-files
    if: false
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: 3.x
    - uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: pip-pyright
    - name: Install dependencies
      run: pip install -e . pyright pytest
    - name: Run pyright
      run: pyright --verifytypes anyio

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12", pypy-3.10]
        include:
        - os: macos-latest
          python-version: "3.8"
        - os: macos-latest
          python-version: "3.12"
        - os: windows-latest
          python-version: "3.8"
        - os: windows-latest
          python-version: "3.12"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: MatteoH2O1999/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
        allow-prereleases: true
        cache: pip
        cache-dependency-path: pyproject.toml
        cache-build: true
        allow-build: allow
    - name: Install dependencies
      run: pip install -e .[test] "trio==0.25.1" "pytest==8.2.1" "cryptography==42.0.7" "hypothesis==6.102.6"
      env:
        SETUPTOOLS_SCM_PRETEND_VERSION: "4.4.0"
    - name: Test with pytest
      run: coverage run -m pytest -v ${{ inputs.test-filter }}
      timeout-minutes: 5
      env:
        PYTEST_DISABLE_PLUGIN_AUTOLOAD: 1
    - name: Generate coverage report
      run: coverage xml

  docs:
    runs-on: ubuntu-latest
    needs: changed-files
    if: false
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: pip
        cache-dependency-path: pyproject.toml
    - name: Install dependencies
      run: pip install -e .[doc]
    - name: Build documentation
      run: sphinx-build -W docs build/sphinx

  coveralls:
    name: Finish Coveralls
    if: false
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - name: Finished
      uses: coverallsapp/github-action@v2
      with:
        parallel-finished: true
